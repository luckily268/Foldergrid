<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'self' file:; font-src 'self' file:;"
  />
  <title>folder-grid</title>
  <link rel="stylesheet" href="./media/grid.css" />
  <link rel="stylesheet" href="./media/theme.css" />
  <link rel="stylesheet" href="./media/desktop.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">▦ folder-grid <span id="rootPath" title="点击更换格子目录"></span></div>
    <div class="actions">
      <button class="ghost" id="rootBtn" title="选择文件目录">📂</button>
      <button class="ghost" id="menuBtn" title="folder-grid 菜单">⋯</button>
      <button class="ghost" id="newBtn" title="新建格子">＋</button>
      <button class="ghost" id="refreshBtn" title="刷新">⟳</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <div class="overlay" id="overlay" hidden>
    <div class="panel" id="panel">
      <div class="panel-body">
        <div class="panel-head">
          <button class="back" id="back" title="返回 (Esc)">←</button>
          <div class="panel-title" id="panelTitle"></div>
          <div class="panel-count" id="panelCount"></div>
          <button class="ghost" id="searchBtn" title="在这个格子里搜索 (Ctrl+F)">🔍</button>
          <button class="ghost" id="revealBtn" title="在系统文件管理器中打开">↗</button>
        </div>
        <div class="search-row" id="searchRow" hidden>
          <span class="search-icon">🔍</span>
          <input class="search-input" id="searchInput" type="text" placeholder="在当前格子里搜索文件名…" />
          <button class="search-clear" id="searchClear" type="button" title="清空">✕</button>
        </div>
        <div class="files" id="files"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./media/grid.js"></script>
</body>
</html>
