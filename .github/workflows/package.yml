name: Build and Release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查语法和发布版本
        run: npm run check

      - name: 文件操作回归测试
        run: npm test

      - name: Windows 启动项测试（临时项，结束清理）
        run: npm run test:startup

      - name: Electron 界面测试
        run: npm run test:smoke

      - name: 打包安装程序
        run: npm run dist

      - name: 打包后的离线 PDF 和中文渲染测试
        run: npm run test:pdf-package

      - name: 本地更新下载与校验测试（不执行安装器）
        run: npm run test:updates

      - name: 保存可下载的安装包
        uses: actions/upload-artifact@v4
        with:
          name: folder-grid-windows-x64
          path: |
            dist/folder-grid-setup-*.exe
            dist/SHA256SUMS.txt
            dist/update/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: 保存界面测试诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: .test-output/
          if-no-files-found: ignore

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/folder-grid-setup-*.exe
            dist/SHA256SUMS.txt
            dist/update/*.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
